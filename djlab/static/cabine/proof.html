<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>A Cabine: engine proof</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: #141016; color: #eee6f0; font: 14px/1.35 system-ui, -apple-system, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
    h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; letter-spacing: .02em; }
    .cab-proof-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .cab-proof-decks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    @media (max-width: 640px) { .cab-proof-decks { grid-template-columns: 1fr; } }
    .cab-proof-deck { background: #221b26; border: 1px solid #3a3040; border-radius: 10px; padding: 10px;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
    .cab-proof-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button, select { font: inherit; color: inherit; background: #3a3040; border: 1px solid #54465c;
      border-radius: 7px; padding: 8px 12px; min-height: 40px; touch-action: manipulation; }
    button.on { background: #7a3f8f; border-color: #a35bbd; }
    button:disabled { opacity: .45; }
    select { max-width: 100%; min-width: 0; flex: 1 1 200px; }
    input[type=range] { width: 100%; }
    .cab-proof-jog { height: 64px; border-radius: 32px; background: repeating-linear-gradient(90deg,
      #2d2433 0 10px, #3a3040 10px 20px); touch-action: none; display: grid; place-items: center;
      color: #b9a8c2; font-size: 12px; }
    .cab-proof-jog.held { outline: 2px solid #a35bbd; }
    .cab-proof-stat { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #cbbad4; white-space: pre-wrap; }
    .cab-proof-warn { color: #ffb3b3; }
    .cab-proof-meas { margin-top: 10px; }
    .cab-proof-meas a { color: #e3b8f2; display: block; margin: 4px 0; word-break: break-all; }
  </style>
</head>
<body>
  <h1>A Cabine: engine proof (dev only)</h1>
  <div class="cab-proof-top">
    <button id="cab-start">Start audio</button>
    <span class="cab-proof-stat" id="cab-global">audio off</span>
  </div>
  <div class="cab-proof-decks" id="cab-decks"></div>

  <section class="cab-proof-deck cab-proof-meas" id="cab-meas">
    <div class="cab-proof-row"><strong>Measurements</strong>
      <select id="cab-meas-pick"></select>
      <button id="cab-meas-run" disabled>Measure</button>
      <button id="cab-meas-rec" disabled>Record 12 s test</button></div>
    <div class="cab-proof-stat" id="cab-meas-out">Tap Start audio, pick a click fixture, then Measure. Play a deck during Measure for a realistic round trip.</div>
    <div class="cab-proof-stat" id="cab-meas-rec-out"></div>
    <div id="cab-meas-files"></div>
  </section>

  <template id="cab-deck-tpl">
    <section class="cab-proof-deck">
      <div class="cab-proof-row"><strong class="cab-name"></strong>
        <select class="cab-pick"><option>loading library...</option></select>
        <button class="cab-load" disabled>Load</button></div>
      <div class="cab-proof-row">
        <button class="cab-play" disabled>Play / pause</button>
        <button class="cab-cue" disabled>Cue</button>
        <button class="cab-sync" disabled>Sync</button>
        <button class="cab-loop" disabled>4 beat / exit</button>
        <button class="cab-jump-back" disabled>-4</button>
        <button class="cab-jump-fwd" disabled>+4</button>
      </div>
      <label>Position <input class="cab-seek" type="range" min="0" max="1" step="0.0001" value="0" disabled></label>
      <label>Tempo (right here = down on the FLX4 = faster) <input class="cab-tempo" type="range" min="0" max="1" step="0.0002" value="0.5" disabled></label>
      <div class="cab-proof-jog" data-jog>scrub: hold and drag</div>
      <div class="cab-proof-stat cab-stat">empty</div>
    </section>
  </template>

  <script type="module">
    import { Deck } from "/static/cabine/engine/deck.js";
    import { DeckVoice } from "/static/cabine/engine/deck-voice.js";
    import { loadTrack, networkSource } from "/static/cabine/engine/loader.js";
    import { timeOfBeat } from "/static/cabine/engine/grid.js";

    const source = networkSource();
    const proof = { ctx: null, decks: [], voices: [], tracks: [], source };
    window.cabineProof = proof;

    const fmt = (s) => {
      if (!Number.isFinite(s)) return "--:--";
      const m = Math.floor(s / 60);
      return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`;
    };

    let library = [];
    try {
      const r = await fetch("/api/cabine/library", { credentials: "same-origin" });
      library = (await r.json()).tracks || [];
    } catch (e) {
      library = [];
    }

    const uis = [];
    for (const name of ["Deck 1", "Deck 2"]) {
      const el = document.getElementById("cab-deck-tpl").content.firstElementChild.cloneNode(true);
      el.querySelector(".cab-name").textContent = name;
      const pick = el.querySelector(".cab-pick");
      pick.innerHTML = "";
      for (const t of library) {
        const o = document.createElement("option");
        o.value = t.file;
        o.textContent = `${t.title} (${fmt(t.duration_s)}, ${t.bpm ?? "?"} BPM)`;
        pick.appendChild(o);
      }
      if (!library.length) pick.innerHTML = "<option>no tracks</option>";
      document.getElementById("cab-decks").appendChild(el);
      uis.push(el);
    }
    if (library.length > 1) uis[1].querySelector(".cab-pick").selectedIndex = 1;

    async function start() {
      if (proof.ctx) { await proof.ctx.resume(); return; }
      if (navigator.audioSession) {
        try { navigator.audioSession.type = "playback"; } catch (e) { /* older Safari */ }
      }
      const ctx = new AudioContext({ latencyHint: "interactive" });
      proof.ctx = ctx;
      await ctx.resume();
      proof.master = ctx.createGain();               // both decks: what the test recording takes
      proof.master.connect(ctx.destination);
      for (let i = 0; i < 2; i++) {
        const voice = await DeckVoice.create(ctx, { testHooks: true });   // dev page: sync() pings
        voice.connect(proof.master);
        const deck = new Deck(voice, { now: () => ctx.currentTime });
        proof.voices.push(voice);
        proof.decks.push(deck);
        wire(uis[i], deck, voice, i);
      }
      document.getElementById("cab-start").textContent = "Audio on";
      document.getElementById("cab-meas-run").disabled = !library.length;
      document.getElementById("cab-meas-rec").disabled = false;
      requestAnimationFrame(tick);
    }

    let wake = null;
    async function keepAwake() {
      const playing = proof.decks.some((d) => d.state.playing);
      try {
        if (playing && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request("screen");
        if (!playing && wake) { await wake.release(); wake = null; }
      } catch (e) { /* not granted */ }
    }

    function wire(el, deck, voice, i) {
      const $ = (s) => el.querySelector(s);
      const other = () => proof.decks[1 - i];
      const buttons = [".cab-play", ".cab-cue", ".cab-sync", ".cab-loop", ".cab-jump-back",
        ".cab-jump-fwd", ".cab-seek", ".cab-tempo"];
      $(".cab-load").disabled = !library.length;
      $(".cab-load").onclick = async () => {
        const file = $(".cab-pick").value;
        $(".cab-load").disabled = true;
        $(".cab-stat").textContent = `loading ${file}...`;
        try {
          const t0 = performance.now();
          const track = await loadTrack(proof.ctx, source, file);
          proof.tracks[i] = { file, ms: Math.round(performance.now() - t0) };
          deck.load(track);
          for (const b of buttons) $(b).disabled = false;
        } catch (e) {
          $(".cab-stat").textContent = `load failed: ${e.message}`;
        }
        $(".cab-load").disabled = false;
      };
      $(".cab-play").onclick = () => { deck.playPause(); keepAwake(); };
      $(".cab-cue").onpointerdown = () => deck.cueDown();
      $(".cab-cue").onpointerup = () => deck.cueUp();
      $(".cab-cue").onpointercancel = () => deck.cueUp();
      $(".cab-sync").onclick = () => deck.syncPress(other());
      $(".cab-loop").onclick = () => deck.fourBeatExit();
      $(".cab-jump-back").onclick = () => deck.beatJump(4);
      $(".cab-jump-fwd").onclick = () => deck.beatJump(5);
      $(".cab-tempo").oninput = (e) => deck.setTempo(Number(e.target.value));
      const seek = $(".cab-seek");
      seek.oninput = () => {
        const s = Number(seek.value) * deck.duration;
        deck._seekNow(s, proof.ctx.currentTime);   // dev page only: no position control on the FLX4
      };
      const jog = $("[data-jog]");
      let lastX = null;
      jog.onpointerdown = (e) => {
        jog.setPointerCapture(e.pointerId);
        lastX = e.clientX;
        jog.classList.add("held");
        deck.jogTouch(true);
      };
      jog.onpointermove = (e) => {
        if (lastX === null) return;
        const dx = e.clientX - lastX;
        lastX = e.clientX;
        if (dx) deck.jogTurn(dx * 0.75);          // 0.75 deg per px
      };
      const up = () => {
        if (lastX === null) return;
        lastX = null;
        jog.classList.remove("held");
        deck.jogTouch(false);
      };
      jog.onpointerup = up;
      jog.onpointercancel = up;
    }

    function tick() {
      const ctx = proof.ctx;
      const T = ctx.currentTime;
      proof.decks.forEach((d, i) => {
        const el = uis[i];
        const v = proof.voices[i];
        el.querySelector(".cab-play").classList.toggle("on", d.state.playing);
        el.querySelector(".cab-sync").classList.toggle("on", d.state.syncOn);
        el.querySelector(".cab-loop").classList.toggle("on", d.state.loop.active);
        el.querySelector(".cab-sync").disabled = !d.state.loaded || d.state.noGrid;
        if (!d.state.loaded) return;
        const s = d.posAt(T);
        const seek = el.querySelector(".cab-seek");
        if (document.activeElement !== seek && Number.isFinite(d.duration)) seek.value = String(s / d.duration);
        const bpm = d.effectiveBpm();
        const t = proof.tracks[i] || {};
        el.querySelector(".cab-stat").innerHTML =
          `${fmt(s)} / ${fmt(d.duration)}  ${bpm ? bpm.toFixed(2) : "?"} BPM  tempo ${d.state.tempoPct.toFixed(2)}%\n` +
          `${d.state.noGrid ? "no reliable grid: sync off\n" : ""}` +
          `loaded in ${t.ms ?? "?"} ms  ` +
          `<span class="${v.underruns ? "cab-proof-warn" : ""}">underruns ${v.underruns}</span>`;
      });
      const mem = performance.memory ? `  heap ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} MB` : "";
      document.getElementById("cab-global").textContent =
        `${ctx.state}, ${ctx.sampleRate} Hz, base latency ${((ctx.baseLatency || 0) * 1000).toFixed(1)} ms${mem}`;
      requestAnimationFrame(tick);
    }

    document.getElementById("cab-start").onclick = () => start();
    proof.start = start;

    // ---- measurements for the iPhone checkpoint (Task 6) ---------------------
    // Everything here reads the engine from outside; the engine is unchanged.

    const RECORDER_TYPES = ["audio/webm;codecs=opus", "audio/mp4", "audio/mp4;codecs=mp4a.40.2"];
    const SOURCE_RATE = 44100;                       // carried MP3s are 44.1 kHz
    const ms = (s) => (Number.isFinite(s) ? (s * 1000).toFixed(2) : "n/a");
    const measPick = document.getElementById("cab-meas-pick");
    for (const t of library) {
      const o = document.createElement("option");
      o.value = t.file;
      o.textContent = t.title;
      measPick.appendChild(o);
    }
    const click = library.findIndex((t) => /click/i.test(t.file));
    if (click >= 0) measPick.selectedIndex = click;
    const measOut = document.getElementById("cab-meas-out");

    function recorderTypes() {
      const out = {};
      for (const t of RECORDER_TYPES) {
        out[t] = typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported
          ? MediaRecorder.isTypeSupported(t) : false;
      }
      return out;
    }

    function memoryNote() {
      const m = performance.memory;
      if (!m) return "performance.memory not available here (Safari): watch for a tab reload instead";
      return `heap ${(m.usedJSHeapSize / 1048576).toFixed(0)} MB used of ${(m.jsHeapSizeLimit / 1048576).toFixed(0)} MB limit`;
    }

    /** The first click through the deck voice, rendered offline at the
     *  context's own rate: seconds after the grid's first beat. */
    /** p, or a rejection after ms ("what timed out after N s"). */
    function withTimeout(p, ms, what) {
      let id;
      const t = new Promise((_, rej) => {
        id = setTimeout(() => rej(new Error(`${what} timed out after ${ms / 1000} s`)), ms);
      });
      return Promise.race([p, t]).finally(() => clearTimeout(id));
    }

    /** One measurement step: its value, or null and a reason, never a throw. */
    async function step(r, name, fn) {
      try {
        return await fn();
      } catch (e) {
        r.errors[name] = (e && e.message) || String(e);
        return null;
      }
    }

    const ONSET_RENDER_S = 1;
    const SYNC_TIMEOUT_MS = 3000;

    /** The first loud sample through the deck voice, rendered offline at the
     *  context's own rate from 0.2 s before the grid's first beat: seconds
     *  after that beat. Only meaningful on a click fixture. */
    async function onsetMinusGrid(track, sr, r) {
      const g = track.grid;
      if (!g) throw new Error("no grid for this track");
      const first = timeOfBeat(g, 0);
      const p0 = Math.max(0, first - 0.2);
      const off = new OfflineAudioContext(2, Math.round(ONSET_RENDER_S * sr), sr);
      const voice = await withTimeout(DeckVoice.create(off, { testHooks: true }), SYNC_TIMEOUT_MS,
        "worklet module on the offline context");
      voice.connect(off.destination);
      const deck = new Deck(voice, { now: () => off.currentTime });
      deck.load(track);
      deck._seekNow(p0, 0);                          // dev page only
      deck.playPause();
      try {
        await withTimeout(voice.sync(), SYNC_TIMEOUT_MS, "offline worklet ping");
      } catch (e) {
        r.notes.onset = `${e.message}; rendered anyway, the onset may read late`;
      }
      const out = await withTimeout(off.startRendering(), 15000, "offline render");
      const L = out.getChannelData(0);
      for (let i = 0; i < L.length; i++) if (Math.abs(L[i]) > 0.1) return p0 + i / sr - first;
      throw new Error(`no click above 0.1 in the ${ONSET_RENDER_S} s render`);
    }

    async function pingStats(voice, n = 200) {
      const d = [];
      for (let i = 0; i < n; i++) {
        const t0 = performance.now();
        await withTimeout(voice.sync(), SYNC_TIMEOUT_MS, `ping ${i + 1} of ${n}`);
        d.push(performance.now() - t0);
      }
      d.sort((a, b) => a - b);
      return { n, medianMs: d[Math.floor(n / 2)], maxMs: d[n - 1] };
    }

    async function measure(file = measPick.value) {
      if (!proof.ctx) await start();
      const ctx = proof.ctx;
      const r = { file, sampleRate: ctx.sampleRate,
        baseLatencyMs: Number.isFinite(ctx.baseLatency) ? ctx.baseLatency * 1000 : null,
        outputLatencyMs: Number.isFinite(ctx.outputLatency) ? ctx.outputLatency * 1000 : null,
        errors: {}, notes: {} };
      measOut.textContent = "measuring...";
      const track = await step(r, "decode", async () => {
        const meta = await withTimeout(source.getMeta(file), 15000, "library");
        r.samples = Number.isFinite(meta.samples) ? meta.samples : null;
        return withTimeout(loadTrack(ctx, source, file), 60000, "fetch and decode");   // the deck's own path
      });
      if (track) {
        r.decodedFrames = track.pcm.left.length;
        r.expectedFrames = r.samples === null ? null : r.samples * ctx.sampleRate / SOURCE_RATE;
        r.extraFrames = r.expectedFrames === null ? null : r.decodedFrames - r.expectedFrames;
        r.headOffsetSamples44k = r.extraFrames === null ? null : r.extraFrames * SOURCE_RATE / ctx.sampleRate;
      }
      const on = track ? await step(r, "onset", () => onsetMinusGrid(track, ctx.sampleRate, r)) : null;
      if (!track) r.errors.onset = "no decoded track";
      r.onsetMinusGridMs = on === null ? null : on * 1000;
      r.playingDuringPings = proof.decks.some((d) => d.state.playing);
      r.pings = await step(r, "pings", () => pingStats(proof.voices[0]));
      r.recorderTypes = (await step(r, "recorder", async () => recorderTypes())) || {};
      r.memory = (await step(r, "memory", async () => memoryNote())) || "n/a";
      proof.measurements = r;
      const f = (x, d = 1) => (x === null || x === undefined ? "n/a" : Number(x).toFixed(d));
      const why = (k) => (r.errors[k] ? `n/a (${r.errors[k]})` : null);
      const pings = r.pings;
      measOut.textContent = [
        `file ${file}`,
        `sampleRate ${r.sampleRate} Hz, baseLatency ${f(r.baseLatencyMs, 2)} ms, outputLatency ${f(r.outputLatencyMs, 2)} ms`,
        why("decode") ? `decoded frames: ${why("decode")}` :
          `decoded ${r.decodedFrames} frames, expected ${f(r.expectedFrames, 1)} (samples ${r.samples ?? "n/a"} x ${r.sampleRate} / ${SOURCE_RATE})`,
        why("decode") ? null : `  decoded - expected = ${f(r.extraFrames, 1)} frames = ${f(r.headOffsetSamples44k, 1)} samples at 44.1 kHz`,
        `  (0 = encoder delay trimmed; untrimmed LAME is about +1105 at the head plus padding)`,
        `first onset - grid first beat = ${why("onset") || `${f(r.onsetMinusGridMs, 3)} ms`} (${ONSET_RENDER_S} s render through the deck voice)`,
        `  (meaningful only on a click fixture: the first loud sample is taken as the first beat)`,
        r.notes.onset ? `  note: ${r.notes.onset}` : null,
        `round trip main thread -> worklet: ` + (why("pings") ||
          `${pings.n} pings, median ${f(pings.medianMs, 2)} ms, max ${f(pings.maxMs, 2)} ms`) +
          (r.playingDuringPings ? " (a deck was playing)" : " (no deck playing)"),
        `MediaRecorder: ` + (why("recorder") ||
          RECORDER_TYPES.map((t) => `${t} ${r.recorderTypes[t] ? "yes" : "no"}`).join(", ")),
        `memory: ${why("memory") || r.memory}`,
      ].filter((x) => x !== null).join("\n");
      return r;
    }

    /** A test recording of the master in chunks, with a beep every second
     *  (so a file shows how much of it survived). Offers the chunks so far
     *  WITHOUT stop() (a simulated crash) and the normally stopped file. */
    async function record(seconds = 12, chunkMs = 3000) {
      if (!proof.ctx) await start();
      const ctx = proof.ctx;
      const recOut = document.getElementById("cab-meas-rec-out");
      const files = document.getElementById("cab-meas-files");
      if (typeof MediaRecorder === "undefined") {
        recOut.textContent = "MediaRecorder: not available in this browser";
        return { mimeType: null };
      }
      const dest = ctx.createMediaStreamDestination();
      proof.master.connect(dest);
      const beep = ctx.createOscillator();
      const bg = ctx.createGain();
      beep.frequency.value = 1000;
      bg.gain.value = 0;
      const t0 = ctx.currentTime + 0.05;
      for (let k = 0; k <= seconds; k++) {
        bg.gain.setValueAtTime(0.1, t0 + k);
        bg.gain.setValueAtTime(0, t0 + k + 0.05);
      }
      beep.connect(bg).connect(proof.master);
      beep.start(t0);
      const types = recorderTypes();
      const pick = RECORDER_TYPES.find((t) => types[t]);
      const rec = new MediaRecorder(dest.stream, pick ? { mimeType: pick } : {});
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise((res) => { rec.onstop = res; });
      recOut.textContent = `recording ${seconds} s in ${chunkMs / 1000} s chunks (${rec.mimeType || pick || "default type"})...`;
      rec.start(chunkMs);
      await new Promise((res) => setTimeout(res, seconds * 1000 + 300));
      const mimeType = rec.mimeType || pick || "";
      const crashChunks = chunks.slice();             // what a killed tab would have
      const crash = new Blob(crashChunks, { type: mimeType });
      rec.stop();
      await stopped;
      beep.stop();
      beep.disconnect();
      proof.master.disconnect(dest);
      const full = new Blob(chunks, { type: mimeType });
      const ext = /mp4/.test(mimeType) ? "mp4" : /webm/.test(mimeType) ? "webm" : "bin";
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      files.innerHTML = "";
      const link = (blob, name, label) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.textContent = label;
        files.appendChild(a);
      };
      link(crash, `cabine-proof-crash-${stamp}.${ext}`,
        `A. simulated crash: ${crashChunks.length} chunks, no stop() (${crash.size} bytes): send this back`);
      link(full, `cabine-proof-stopped-${stamp}.${ext}`,
        `B. normal: stopped, ${chunks.length} chunks (${full.size} bytes): send this back`);
      recOut.textContent = `recorded ${mimeType || "default type"}; beeps every second from the start. ` +
        "Download both files below and send them back.";
      const r = { mimeType, crash: { chunks: crashChunks.length, bytes: crash.size },
        stopped: { chunks: chunks.length, bytes: full.size } };
      proof.recording = r;
      return r;
    }

    proof.measure = { run: measure, record };
    document.getElementById("cab-meas-run").onclick = async (e) => {
      e.target.disabled = true;
      try { await measure(); } catch (err) { measOut.textContent = `measure failed: ${err.message}`; }
      e.target.disabled = false;
    };
    document.getElementById("cab-meas-rec").onclick = async (e) => {
      e.target.disabled = true;
      try { await record(); } catch (err) {
        document.getElementById("cab-meas-rec-out").textContent = `recording failed: ${err.message}`;
      }
      e.target.disabled = false;
    };
  </script>
</body>
</html>
